<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle del dispositivo | Nexora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-nexora sticky-top">
    <div class="container">
      <a class="nexora-logo" href="index.html">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3.2" fill="currentColor" />
            <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.6" />
            <ellipse cx="12" cy="12" rx="4.2" ry="10" stroke="currentColor" stroke-width="1.6" transform="rotate(35 12 12)" />
          </svg>
        </span>
        Nexora
      </a>
      <div class="collapse navbar-collapse flex-grow-0 ms-auto">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item">
            <a class="nav-link btn-admin-link ms-lg-2" href="admin/login.html">
              <i class="bi bi-shield-lock me-1"></i>Administración
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <nav class="breadcrumb-nexora mb-4">
      <a href="index.html"><i class="bi bi-house"></i> Inicio</a>
      <span class="mx-1">/</span>
      <span id="breadcrumbNombre" class="text-body fw-semibold">Detalle</span>
    </nav>

    <div id="estadoCarga" class="text-center py-5">
      <div class="spinner-border text-dark" role="status"></div>
    </div>

    <div id="errorDispositivo" class="alert alert-danger d-none"></div>

    <div id="contenidoDetalle" class="d-none">
      <div class="row g-5 mb-5">
        <div class="col-12 col-lg-5">
          <div class="gallery-sticky">
            <div class="detail-image-wrap">
              <img id="detalleImagen" src="" alt="" />
            </div>
            <div class="gallery-thumbs" id="galeriaThumbs"></div>
          </div>
        </div>
        <div class="col-12 col-lg-7 detail-panel">
          <span class="badge-tipo" id="detalleTipo"></span>
          <h1 id="detalleNombre"></h1>
          <p class="text-muted mb-3" id="detalleMarcaFecha"></p>
          <div class="mb-3" id="detalleRating"></div>
          <p class="detail-price mb-3" id="detallePrecio"></p>
          <p id="detalleDescripcion" class="mb-4" style="max-width: 560px;"></p>

          <div class="spec-chips mb-4" id="detalleSpecChips"></div>

          <p class="mb-4"><span id="detalleStock" class="badge bg-success rounded-pill px-3 py-2"></span></p>
        </div>
      </div>

      <div class="nexora-card mb-4" data-reveal>
        <div class="nexora-card__header">Especificaciones técnicas</div>
        <div class="p-4">
          <table class="table spec-table mb-0">
            <tbody id="detalleSpecs"></tbody>
          </table>
        </div>
      </div>

      <section class="mb-5" data-reveal>
        <h2 class="h4 mb-3 fw-bold">
          Opiniones de usuarios
        </h2>

        <div class="review-summary-box mb-4" id="reviewSummaryBox">
          <div class="score" id="reviewScore">—</div>
          <div>
            <div id="reviewStars" class="rating-stars fs-5"></div>
            <div class="text-muted small" id="reviewCount">Sin opiniones aún</div>
          </div>
        </div>

        <div id="listaComentarios" class="d-flex flex-column gap-3 mb-4"></div>
        <p id="sinComentarios" class="text-muted d-none">Sé el primero en comentar sobre este dispositivo.</p>

        <div class="nexora-card">
          <div class="p-4">
            <h3 class="h6 mb-3 fw-bold">Deja tu opinión</h3>
            <form id="formComentario" class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label" for="comentarioNombre">Nombre</label>
                <input type="text" id="comentarioNombre" class="form-control" required maxlength="80" />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="comentarioCorreo">Correo (opcional)</label>
                <input type="email" id="comentarioCorreo" class="form-control" />
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="comentarioCalificacion">Calificación</label>
                <select id="comentarioCalificacion" class="form-select" required>
                  <option value="5">★★★★★ Excelente</option>
                  <option value="4">★★★★☆ Muy bueno</option>
                  <option value="3">★★★☆☆ Bueno</option>
                  <option value="2">★★☆☆☆ Regular</option>
                  <option value="1">★☆☆☆☆ Malo</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="comentarioTexto">Comentario</label>
                <textarea id="comentarioTexto" class="form-control" rows="3" required maxlength="1000"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-nexora-primary">Publicar comentario</button>
                <span id="comentarioMensaje" class="ms-2 small"></span>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer-nexora py-4 mt-auto">
    <div class="container text-center small">
      <p class="mb-0">© 2026 Nexora — Proyecto académico de catálogo de dispositivos inteligentes.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/detalle.js"></script>
  <script>initNavbarScrollShadow();</script>
</body>
</html>
