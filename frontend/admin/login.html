<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración | Nexora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link href="../assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="login-shell d-flex align-items-center justify-content-center p-3">
    <div class="login-card row g-0 overflow-hidden" style="max-width: 860px; width: 100%;">
      <div class="col-12 col-md-5 login-side d-none d-md-flex">
        <canvas class="particles-canvas" id="loginParticles"></canvas>
        <div class="login-side__content">
          <span class="mark mark--lg mb-4 float-anim">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="3.2" fill="currentColor" />
              <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.6" />
              <ellipse cx="12" cy="12" rx="4.2" ry="10" stroke="currentColor" stroke-width="1.6" transform="rotate(35 12 12)" />
            </svg>
          </span>
          <h2 class="fw-bold mb-2">Panel de administración</h2>
          <p class="mb-0" style="color: rgba(255,255,255,0.75);">
            Gestiona el catálogo de dispositivos, modera comentarios y administra marcas y tipos
            desde un solo lugar.
          </p>
        </div>
      </div>
      <div class="col-12 col-md-7 bg-white p-4 p-md-5">
        <div class="mb-4 d-md-none text-center">
          <h1 class="h4 fw-bold">Nexora</h1>
        </div>
        <h2 class="h4 fw-bold mb-1">Iniciar sesión</h2>
        <p class="text-muted mb-4">Ingresa tus credenciales de administrador.</p>

        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label" for="usuario">Usuario</label>
            <input type="text" id="usuario" class="form-control" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" class="form-control" required />
          </div>
          <div id="loginError" class="alert alert-danger d-none py-2 small"></div>
          <button type="submit" class="btn btn-nexora-primary w-100 py-2">Iniciar sesión</button>
        </form>

        <p class="text-muted small text-center mt-4 mb-0">
          Credenciales de demostración: <strong>admin</strong> / <strong>Admin123!</strong>
        </p>
        <p class="text-center mt-2 mb-0">
          <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Volver al catálogo</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/effects.js"></script>
  <script src="../assets/js/admin-login.js"></script>
  <script>
    const canvasLogin = document.getElementById('loginParticles');
    if (canvasLogin) initParticles(canvasLogin, { count: 34 });
  </script>
</body>
</html>
